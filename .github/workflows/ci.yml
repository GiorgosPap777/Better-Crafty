# Checks every push and pull request, then publishes the Docker image.
#
# Checks: code format (black), pylint, the Python tests on every Python
# version Crafty supports, the Terminal command suggestions, and a start of
# Crafty itself. The image is only built when they all pass.
#
# Docker image (amd64 and arm64), only from the default branch and from
# version tags, to Docker Hub only: <DOCKERHUB_USERNAME>/better-crafty. Needs
# the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub
# access token; "Read & Write" is enough for the image, the Docker Hub page
# needs "Read, Write, Delete"). Without them nothing is published. Docker Hub
# creates the repository on the first push.
#
# Image tags: "edge" for every push to the default branch; "latest", "1.2.3"
# and "1.2" for a v1.2.3 (or 1.2.3) git tag, which must match "better_crafty"
# in app/config/version.json; and "sha-<commit>" for every build. The Docker
# Hub page is updated by dockerhub-description.yml.
name: Tests and Docker image

on:
  push:
    branches: ["**"]
    tags: ["v*", "[0-9]*"]
    # Changes to documentation alone need no checks or new image
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and pylint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        # Pinned, so that a new release of a tool cannot turn the checks red
        run: pip install -r requirements.txt black==26.5.1 pylint==4.1.3
      - name: black
        run: black --check app tests main.py
      - name: pylint
        run: pylint app tests main.py

  tests:
    name: Python ${{ matrix.python }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest==9.1.1
      - name: pytest
        run: pytest -q tests

  commands:
    name: Command suggestions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node dev/command-data/test_complete.js

  startup:
    name: Crafty starts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Start Crafty and open the login page
        run: |
          python main.py --daemon --ignore > crafty.log 2>&1 &
          for attempt in $(seq 1 60); do
            status="$(curl -sk https://127.0.0.1:8443/api/v2/crafty/check | jq -r '.status // empty' 2>/dev/null || true)"
            if [ "$status" = "ok" ]; then
              code="$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:8443/login)"
              echo "Crafty is up; /login returned $code"
              test "$code" = "200" && test -s app/config/default-creds.txt
              exit
            fi
            sleep 2
          done
          echo "::error::Crafty did not start within two minutes"
          cat crafty.log
          exit 1
      - name: Crafty's log
        if: always()
        run: cat crafty.log logs/commander.log 2>/dev/null | tail -100

  docker:
    name: Docker image
    needs: [lint, tests, commands, startup]
    # Publish from the default branch and from version tags only
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref_name == github.event.repository.default_branch ||
      startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Choose the image name
        id: names
        run: |
          version="$(jq -r .better_crafty app/config/version.json)"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match better_crafty $version in app/config/version.json"
            exit 1
          fi
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::notice::Docker Hub secrets not set, nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "image=${DOCKERHUB_USERNAME,,}/better-crafty"
            echo "version=$version"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"

      - name: Image tags and labels
        if: steps.names.outputs.publish == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.names.outputs.image }}
          flavor: latest=false
          tags: |
            type=edge
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha
          labels: |
            org.opencontainers.image.title=Better Crafty
            org.opencontainers.image.version=${{ steps.names.outputs.version }}

      - uses: docker/setup-qemu-action@v4
        if: steps.names.outputs.publish == 'true'

      - uses: docker/setup-buildx-action@v4
        if: steps.names.outputs.publish == 'true'

      - name: Log in to Docker Hub
        if: steps.names.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.names.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
